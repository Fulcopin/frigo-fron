<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiar Autosave - Formularios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .autosave-list {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
        }

        .autosave-item {
            padding: 10px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .autosave-item:last-child {
            border-bottom: none;
        }

        .autosave-item:hover {
            background: #f8f9fa;
        }

        .autosave-key {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #495057;
            flex: 1;
        }

        .autosave-size {
            font-size: 11px;
            color: #6c757d;
            margin-left: 10px;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            color: #2d3436;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(253, 203, 110, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e9ecef;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpiador de Autosave</h1>
        <p class="subtitle">Herramienta para limpiar datos guardados automáticamente en formularios</p>

        <div id="alerts"></div>

        <div class="section">
            <h2>📊 Estadísticas</h2>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">Items Guardados</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalSize">0 KB</div>
                    <div class="stat-label">Tamaño Total</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>📁 Datos de Autosave</h2>
            <div id="autosaveList" class="autosave-list"></div>
        </div>

        <div class="section">
            <h2>🔧 Acciones</h2>
            <button class="btn btn-primary" onclick="cargarDatos()">
                🔄 Recargar Lista
            </button>
            <button class="btn btn-warning" onclick="limpiarFormularioActual()">
                🗑️ Limpiar Formulario Actual (Template 10)
            </button>
            <button class="btn btn-danger" onclick="limpiarTodo()">
                🔥 Limpiar TODO el Autosave
            </button>
        </div>
    </div>

    <script>
        function mostrarAlerta(mensaje, tipo) {
            const alertsDiv = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${tipo}`;
            alert.textContent = mensaje;
            alertsDiv.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function cargarDatos() {
            const autosaveList = document.getElementById('autosaveList');
            const autosaveKeys = [];
            let totalSize = 0;

            // Buscar todas las keys de autosave
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.includes('autosave')) {
                    const value = localStorage.getItem(key);
                    const size = new Blob([value]).size;
                    autosaveKeys.push({ key, size });
                    totalSize += size;
                }
            }

            // Actualizar estadísticas
            document.getElementById('totalCount').textContent = autosaveKeys.length;
            document.getElementById('totalSize').textContent = formatBytes(totalSize);

            // Mostrar lista
            if (autosaveKeys.length === 0) {
                autosaveList.innerHTML = `
                    <div class="empty-state">
                        <svg fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                        </svg>
                        <p><strong>¡Todo limpio!</strong></p>
                        <p>No hay datos de autosave guardados</p>
                    </div>
                `;
            } else {
                autosaveList.innerHTML = autosaveKeys.map(item => `
                    <div class="autosave-item">
                        <div class="autosave-key">${item.key}</div>
                        <div class="autosave-size">${formatBytes(item.size)}</div>
                    </div>
                `).join('');
            }

            mostrarAlerta(`✅ Lista actualizada: ${autosaveKeys.length} items encontrados`, 'info');
        }

        function limpiarFormularioActual() {
            if (!confirm('¿Limpiar SOLO el autosave del Template 10 (CONTROL DE PRODUCCIÓN PARA FILETEO)?')) {
                return;
            }

            let contador = 0;
            const keysParaBorrar = [];

            // Buscar keys relacionadas con template 10
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.includes('autosave') && key.includes('10')) {
                    keysParaBorrar.push(key);
                }
            }

            // Borrar
            keysParaBorrar.forEach(key => {
                localStorage.removeItem(key);
                contador++;
            });

            mostrarAlerta(`🗑️ ${contador} items del Template 10 eliminados`, 'success');
            cargarDatos();
        }

        function limpiarTodo() {
            if (!confirm('⚠️ ¿ELIMINAR TODO el autosave? Esta acción NO se puede deshacer.')) {
                return;
            }

            let contador = 0;
            const keysParaBorrar = [];

            // Buscar todas las keys de autosave
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.includes('autosave')) {
                    keysParaBorrar.push(key);
                }
            }

            // Borrar
            keysParaBorrar.forEach(key => {
                localStorage.removeItem(key);
                contador++;
            });

            mostrarAlerta(`🔥 ${contador} items eliminados completamente`, 'success');
            cargarDatos();
        }

        // Cargar datos al iniciar
        window.addEventListener('DOMContentLoaded', () => {
            cargarDatos();
        });
    </script>
</body>
</html>
